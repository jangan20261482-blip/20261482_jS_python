<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Welcome</title>
    <style>
        body {
            font-size: 1.2em;
            text-align: center;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div id="contents">
        <ul>
            <li> 
                <label for="oPrice">상품의 원래 가격:</label>
                <input type="text" id="oPrice">원
            </li>
            <li>
                <label for="rate">할인율:</label>
                <input type="text" id="rate">%
            </li>
            <li>
                <button onclick="showPrice()">할인 가격 계산하기</button>
            </li>
        </ul>
        <div id="showResult"></div>
    </div>

    <!--<h1>자바스크립트 3주차 수업입니다.</h1>-->

    <script>
        
        // var name = prompt("태어난 연도를 입력하세요");
        // var age = 2026 - name + 1;
        // document.write("현재 나이는 " + age + "세입니다.");

        function showPrice() {
            var originPrice = document.querySelector("#oPrice").value;
            var rate = document.querySelector("#rate").value;

            // 1. savePrice -> savedPrice 로 통일
            var savedPrice = originPrice * (rate / 100);
            var resultPrice = originPrice - savedPrice;

            // 2. origin-Price -> originPrice 로 수정
            document.querySelector("#showResult").innerHTML = 
                "상품의 원래 가격은 " + originPrice + "원이고, 할인율은 " + rate + "%입니다. " + 
                savedPrice + "원을 절약한 " + resultPrice + "원에 살 수 있습니다.";
        }
    </script>
</body>
</html>
